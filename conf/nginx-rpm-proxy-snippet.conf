# local-repo : relais vers les miroirs RPM officiels avec cache (certificats des miroirs vérifiés).
resolver @RESOLVERS@ ipv6=off valid=300s;
resolver_timeout 10s;
proxy_pass https://$lr_rpm_host$lr_rpm_prefix$lr_rpm_path$is_args$args;
proxy_set_header Host $lr_rpm_host;
proxy_set_header Connection "";
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name $lr_rpm_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_cache local_repo_rpm;
proxy_cache_key $lr_rpm_up/$lr_rpm_path;
proxy_cache_lock on;
proxy_cache_lock_timeout 10m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_read_timeout 300s;
add_header X-Local-Repo-Cache $upstream_cache_status always;
