# local-repo : relais HTTPS (port 443) pour les domaines Windows Update redirigés.
# Le trafic chiffré n'est pas mis en cache : il est transmis tel quel au vrai serveur.
# Les noms hors de la liste du portail sont refusés (évite un relais ouvert et les boucles).
stream {
    map $ssl_preread_server_name $local_repo_wu_upstream {
        hostnames;
        default 127.0.0.1:1;
        include /var/lib/local-repo/nginx/wu-stream.map;
    }

    server {
        listen 443;
        include /etc/nginx/snippets/local-repo-clients.conf;
        resolver @RESOLVERS@ ipv6=off valid=300s;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_pass $local_repo_wu_upstream;
    }
}
