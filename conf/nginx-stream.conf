# local-repo : relais HTTPS (port 443) pour les domaines Windows Update redirigés.
# Le trafic chiffré n'est pas mis en cache : il est transmis tel quel au vrai serveur.
stream {
    server {
        listen 443;
        resolver @RESOLVERS@ ipv6=off valid=300s;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_pass $ssl_preread_server_name:443;
    }
}
