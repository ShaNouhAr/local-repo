# loco : famille Red Hat (inclus dans les serveurs HTTP et HTTPS du portail).
# Les postes vérifient les signatures : clés des distributions pour le cache, clé loco pour le dépôt local.

# Paquets et métadonnées au nom unique (empreinte) : immuables.
location ~ "^/rpmcache/(?<lr_rpm_up>rocky|almalinux|epel)/(?<lr_rpm_path>.+\.rpm|.*/repodata/[0-9a-f]{32,}-[^/]+)$" {
    include snippets/loco-clients.conf;
    include snippets/loco-rpm-proxy.conf;
    proxy_cache_valid 200 365d;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
}

# Index (repomd.xml…) : changent à chaque publication, gardés brièvement.
location ~ ^/rpmcache/(?<lr_rpm_up>rocky|almalinux|epel)/(?<lr_rpm_path>.*)$ {
    include snippets/loco-clients.conf;
    include snippets/loco-rpm-proxy.conf;
    proxy_cache_valid 200 2m;
    proxy_cache_revalidate on;
}

# Dépôts RPM locaux (el8, el9…), métadonnées signées par la clé du dépôt.
location ^~ /rpm/el {
    include snippets/loco-clients.conf;
    alias @DATA@/rpm/el;
    add_header X-Content-Type-Options nosniff always;
    location ~ /\. { deny all; }
}

location = /rpm/loco.asc {
    include snippets/loco-clients.conf;
    alias @DATA@/rpm/loco.asc;
    default_type application/pgp-keys;
}
