# local-repo : portail.
#   HTTP  (@PORTAL_PORT@) : ce dont les postes clients ont besoin (dépôt APT signé GPG, installeurs vérifiés
#                           par SHA256, scripts, certificat de l'autorité) ; tout le reste redirige vers HTTPS.
#   HTTPS (@HTTPS_PORT@)  : interface d'administration, certificat signé par l'autorité locale.

server {
    listen @PORTAL_PORT@;
    listen [::]:@PORTAL_PORT@;
    server_name _;

    client_max_body_size 0;
    access_log /var/log/nginx/local-repo-portal.log;

    location /apt/ {
        alias @DATA@/apt/;
        autoindex on;
        location ~ /\. { deny all; }
    }

    location /win/files/ {
        alias @DATA@/win/;
        location ~ /\. { deny all; }
    }

    location = /ca.crt {
        alias /etc/local-repo/tls/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location ~ ^/(win/i/|linux/setup\.sh$|healthz$) {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 301 https://$host:@HTTPS_PORT@$request_uri;
    }
}

server {
    listen @HTTPS_PORT@ ssl;
    listen [::]:@HTTPS_PORT@ ssl;
    server_name _;

    ssl_certificate     /etc/local-repo/tls/server.crt;
    ssl_certificate_key /etc/local-repo/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:local_repo_tls:5m;
    ssl_session_timeout 1d;

    client_max_body_size 0;
    access_log /var/log/nginx/local-repo-portal.log;

    location /apt/ {
        alias @DATA@/apt/;
        autoindex on;
        location ~ /\. { deny all; }
    }

    location /win/files/ {
        alias @DATA@/win/;
        location ~ /\. { deny all; }
    }

    location = /ca.crt {
        alias /etc/local-repo/tls/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location /static/ {
        alias /opt/local-repo/portal/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
