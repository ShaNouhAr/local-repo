# local-repo : interface HTTPS et fichiers des postes clients.
# Accès : snippets/local-repo-clients.conf (postes) et snippets/local-repo-admin.conf (interface),
# générés par install.sh à partir de --allow et --admin-allow.

server {
    listen @HTTPS_PORT@ ssl;
    listen [::]:@HTTPS_PORT@ ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/local-repo/tls/server.crt;
    ssl_certificate_key /etc/local-repo/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:local_repo_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size @MAX_UPLOAD@;
    access_log /var/log/nginx/local-repo-portal.log;

    # --- postes clients
    location ^~ /apt/ {
        include snippets/local-repo-clients.conf;
        alias @DATA@/apt/;
        autoindex on;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    location ^~ /win/files/ {
        include snippets/local-repo-clients.conf;
        alias @DATA@/win/;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    @FLATPAK_LOCATIONS@

    @RPM_LOCATIONS@

    location = /ca.crt {
        include snippets/local-repo-clients.conf;
        alias /etc/local-repo/tls/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location ~ ^/(win/i/|linux/setup\.sh$|linux/repositories/[^/]+/[^/]+\.sources$|flatpak/setup\.sh$|rpm/setup\.sh$|flatpak/local-repo\.flatpakrepo$|healthz$) {
        include snippets/local-repo-clients.conf;
        include snippets/local-repo-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- interface d'administration et supervision
    location /static/ {
        include snippets/local-repo-admin.conf;
        alias /opt/local-repo/portal/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        include snippets/local-repo-admin.conf;
        include snippets/local-repo-proxy.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
