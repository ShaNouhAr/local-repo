# local-repo : portail web + fichiers publics (dépôt APT local, logiciels Windows).
server {
    listen @PORTAL_PORT@;
    listen [::]:@PORTAL_PORT@;
    server_name _;

    client_max_body_size 0;
    access_log /var/log/nginx/local-repo-portal.log;

    location /apt/ {
        alias @DATA@/apt/;
        autoindex on;
        location ~ /\. { deny all; }
    }

    location /win/files/ {
        alias @DATA@/win/;
        location ~ /\. { deny all; }
    }

    location /static/ {
        alias /opt/local-repo/portal/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
