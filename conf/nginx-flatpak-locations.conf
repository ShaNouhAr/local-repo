# loco : Flatpak (inclus dans les serveurs HTTP et HTTPS du portail).
# Les postes vérifient les signatures GPG de Flathub et du dépôt local : le transport ne peut rien altérer.

# Objets OSTree et deltas : adressés par leur empreinte, donc immuables.
location ~ ^/flathub/repo/(objects|deltas)/ {
    include snippets/loco-clients.conf;
    include snippets/loco-flathub-proxy.conf;
    proxy_cache_valid 200 365d;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
}

# Index (summary, config, refs…) : changent à chaque publication, gardés brièvement.
location /flathub/ {
    include snippets/loco-clients.conf;
    include snippets/loco-flathub-proxy.conf;
    proxy_cache_valid 200 2m;
    proxy_cache_revalidate on;
}

# Dépôt Flatpak local (signé par la clé du dépôt).
location ^~ /flatpak/repo/ {
    include snippets/loco-clients.conf;
    alias @DATA@/flatpak/repo/;
    add_header X-Content-Type-Options nosniff always;
    location ~ /\. { deny all; }
}
