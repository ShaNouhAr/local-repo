
# HTTP (--http-port) : amorçage des postes qui ne font pas encore confiance à l'autorité locale.
# Ne sert que le dépôt APT (signé GPG), les installeurs (vérifiés SHA256), les scripts et ca.crt ;
# le reste redirige vers HTTPS. Désactivable avec --no-http.
server {
    listen @PORTAL_PORT@;
    listen [::]:@PORTAL_PORT@;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/local-repo-portal.log;

    location ^~ /apt/ {
        include snippets/local-repo-clients.conf;
        alias @DATA@/apt/;
        autoindex on;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    location ^~ /win/files/ {
        include snippets/local-repo-clients.conf;
        alias @DATA@/win/;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { deny all; }
    }

    @FLATPAK_LOCATIONS@

    @RPM_LOCATIONS@

    location = /ca.crt {
        include snippets/local-repo-clients.conf;
        alias /etc/local-repo/tls/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location ~ ^/(win/i/|linux/setup\.sh$|linux/repositories/[^/]+/[^/]+\.sources$|flatpak/setup\.sh$|rpm/setup\.sh$|flatpak/local-repo\.flatpakrepo$|healthz$) {
        include snippets/local-repo-clients.conf;
        include snippets/local-repo-proxy.conf;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 301 https://$host:@HTTPS_PORT@$request_uri;
    }
}
