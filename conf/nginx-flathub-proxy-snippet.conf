# loco : relais vers Flathub avec cache.
resolver @RESOLVERS@ ipv6=off valid=300s;
resolver_timeout 10s;
set $loco_flathub dl.flathub.org;
rewrite ^/flathub/(.*)$ /$1 break;
proxy_pass https://$loco_flathub;
proxy_set_header Host dl.flathub.org;
proxy_set_header Connection "";
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name dl.flathub.org;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate @CA_BUNDLE@;
proxy_cache loco_flatpak;
proxy_cache_key $uri;
proxy_cache_lock on;
proxy_cache_lock_timeout 5m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_read_timeout 300s;
add_header X-Loco-Cache $upstream_cache_status always;
