# loco : cache Windows Update (même principe que lancache).
# Les postes arrivent ici parce que le DNS fait pointer les domaines Windows Update
# vers ce serveur ; nginx va chercher le contenu chez Microsoft et le garde en cache.

log_format loco_wu '$remote_addr [$time_local] "$request" $status $body_bytes_sent $upstream_cache_status "$host"';

proxy_cache_path @DATA@/wucache levels=2:2 keys_zone=loco_wu:256m
                 inactive=365d max_size=@WU_CACHE_SIZE@ use_temp_path=off
                 loader_files=1000 loader_sleep=50ms loader_threshold=300ms;

# Seuls les domaines de la liste du portail sont relayés (fichier régénéré par le portail).
map $host $loco_wu_allowed {
    hostnames;
    default 0;
    include /var/lib/loco/nginx/wu-http.map;
}

# Seuls les fichiers immuables (nom contenant une empreinte ou un GUID) sont gardés en cache ;
# le reste (listes de certificats, métadonnées) passe toujours chez Microsoft.
map $uri $loco_wu_nocache {
    default                                                 1;
    "~*[0-9a-f]{40}"                                        0;
    "~*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" 0;
    "~*/filestreamingservice/files/"                        0;
}

# Les différents CDN Microsoft servent les mêmes fichiers : une seule clé de cache.
map $host $loco_wu_key {
    hostnames;
    default                        $host;
    .windowsupdate.com             windowsupdate;
    .delivery.mp.microsoft.com     windowsupdate;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    include snippets/loco-clients.conf;

    access_log /var/log/nginx/loco-wu.log loco_wu;

    # Résolveurs publics : le DNS du réseau renvoie ce serveur pour ces domaines.
    resolver @RESOLVERS@ ipv6=off valid=300s;
    resolver_timeout 10s;

    if ($loco_wu_allowed = 0) {
        return 403;
    }

    location / {
        slice 1m;
        proxy_cache loco_wu;
        proxy_cache_key $loco_wu_key$uri$slice_range;
        proxy_cache_valid 200 206 3650d;
        proxy_ignore_headers Expires Cache-Control Set-Cookie Vary X-Accel-Expires;
        proxy_cache_lock on;
        proxy_cache_lock_age 2m;
        proxy_cache_lock_timeout 1h;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_no_cache $loco_wu_nocache;
        proxy_cache_bypass $loco_wu_nocache;

        proxy_set_header Range $slice_range;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ignore_client_abort on;
        proxy_read_timeout 150s;

        add_header X-Loco-Cache $upstream_cache_status;
        proxy_pass http://$host$request_uri;
    }
}

# Accès direct au serveur par son nom ou son IP : pas de proxy (évite les boucles).
server {
    listen 80;
    server_name @HOST@ @HOSTNAME@ localhost 127.0.0.1;
    server_tokens off;
    access_log off;
    default_type text/plain;
    return 200 "loco : cache Windows Update.\n";
}
