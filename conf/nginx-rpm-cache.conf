# loco : cache des miroirs RPM officiels (zone partagée par les serveurs HTTP et HTTPS du portail).
proxy_cache_path @DATA@/rpmcache levels=2:2 keys_zone=loco_rpm:64m
                 inactive=180d max_size=@RPM_CACHE_SIZE@ use_temp_path=off;

map $lr_rpm_up $lr_rpm_host {
    rocky       dl.rockylinux.org;
    almalinux   repo.almalinux.org;
    epel        dl.fedoraproject.org;
}
map $lr_rpm_up $lr_rpm_prefix {
    rocky       /pub/rocky/;
    almalinux   /almalinux/;
    epel        /pub/epel/;
}
