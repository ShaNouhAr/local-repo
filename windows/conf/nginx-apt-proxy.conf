# loco (serveur Windows) : cache APT à la place d'apt-cacher-ng, qui n'existe pas sous Windows.
# Les postes l'utilisent comme proxy HTTP (Acquire::http::Proxy, port 3142), pour tout dépôt en HTTP ;
# seuls les fichiers des dépôts APT sont relayés, le reste est refusé (pas de proxy ouvert).

log_format loco_apt '$remote_addr [$time_local] "$request_method $http_host$uri" $status $body_bytes_sent $upstream_cache_status';

proxy_cache_path @DATA@/aptcache levels=2:2 keys_zone=loco_apt:64m
                 inactive=180d max_size=@APT_CACHE_SIZE@ use_temp_path=off;

# Requêtes adressées au serveur lui-même (et non à un dépôt) : refusées, ce qui évite toute boucle.
map $host $loco_apt_self {
    hostnames;
    default     0;
    @APT_SELF_HOSTS@
}

server {
    listen @ACNG_PORT@;
    server_name _;
    server_tokens off;
    include snippets/loco-clients.conf;
    access_log @LOGDIR@/loco-apt.log loco_apt;

    resolver @DNS@ ipv6=off valid=300s;
    resolver_timeout 10s;

    proxy_cache loco_apt;
    proxy_cache_key $http_host$uri;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10m;
    proxy_cache_lock_age 10m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    add_header X-Loco-Cache $upstream_cache_status always;

    if ($loco_apt_self) {
        return 403;
    }

    # Index publiés par empreinte : immuables.
    location ~ "/by-hash/" {
        proxy_cache_valid 200 365d;
        proxy_pass http://$http_host$request_uri;
    }
    # Index (Release, Packages…) : courte durée, revalidés auprès du dépôt.
    location ~ "/dists/" {
        proxy_cache_valid 200 2m;
        proxy_cache_revalidate on;
        proxy_pass http://$http_host$request_uri;
    }
    # Paquets et sources : un nom par version, gardés longtemps.
    location ~ "\.(deb|udeb|ddeb|dsc|diff\.gz|tar\.(gz|xz|bz2|lzma|zst))$" {
        proxy_cache_valid 200 365d;
        proxy_pass http://$http_host$request_uri;
    }
    location / {
        return 403;
    }
}
