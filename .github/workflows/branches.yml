name: Branches
# À chaque version publiée (tag vX.Y.Z) : régénère les branches « linux » et « windows » depuis main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: branches
  cancel-in-progress: false
jobs:
  branches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Générer et publier les branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for b in linux windows; do
              if git rev-parse -q --verify "refs/remotes/origin/$b" >/dev/null; then git branch -f "$b" "origin/$b"; fi
          done
          python3 tools/branches.py HEAD
          git push origin linux windows
