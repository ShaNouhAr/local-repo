; Généré par install.sh --container : processus de local-repo dans l'image Docker
; (remplace les unités systemd de l'installation native).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/local-repo-supervisor.sock
chmod=0700
username=local-repo
password=@SUP_PASSWORD@

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/local-repo-supervisor.sock
username=local-repo
password=@SUP_PASSWORD@

[program:apt-cacher-ng]
command=/usr/sbin/apt-cacher-ng -c /etc/apt-cacher-ng ForeGround=1
user=apt-cacher-ng
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:local-repo-portal]
command=/usr/bin/gunicorn @GUNICORN_FLAGS@ --workers 1 --threads 8 --timeout 120 --bind 127.0.0.1:@APP_PORT@ --access-logfile - --access-logformat "%%(h)s %%(m)s %%(U)s %%(s)s" app:app
directory=/opt/local-repo/portal
user=localrepo
environment=HOME="/var/lib/local-repo",USER="localrepo",LR_DATA="@DATA@",LR_STATE="/var/lib/local-repo",LR_ETC="/etc/local-repo",LR_PUBLIC_URL="@HTTP_URL@",LR_ADMIN_URL="@ADMIN_URL@",LR_HOST="@HOST@",LR_ACNG_PORT="3142",LR_BACKUP_DIR="@BACKUP_DIR@",LR_FLATPAK="@FLATPAK@",LR_RPM="@RPM@",LR_RUNTIME="container",TMPDIR="@DATA@/.tmp"@SUP_PROXY_ENV@
umask=022
priority=20
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:local-repo-cron]
command=/usr/local/sbin/local-repo-cron
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
