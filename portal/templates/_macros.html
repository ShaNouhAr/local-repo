{% macro cmd(id, text, prompt='$') -%}
<div class="cmd"><code id="{{ id }}" data-prompt="{{ prompt }}">{{ text }}</code><button type="button" class="copy">Copier</button></div>
{%- endmacro %}

{% macro service(active) -%}
<span class="st {{ 'ok' if active else 'err' }}">{{ 'actif' if active else 'arrêté' }}</span>
{%- endmacro %}
