{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block body %}
{% from '_nav_icons.html' import theme_toggle %}
<div class="login">
  <div class="login-box">
    <div class="brand"><b>loco</b><span>{{ host }}</span></div>
    <form method="post" class="panel">
      <div class="panel-h"><h2>Connexion</h2></div>
      <div class="panel-b">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label class="f"><span>Identifiant</span>
          <input type="text" name="username" value="{{ username }}" required autocomplete="username" autocapitalize="none" spellcheck="false" {{ 'autofocus' if not username }}>
        </label>
        <label class="f"><span>Mot de passe</span>
          <input type="password" name="password" required autocomplete="current-password" {{ 'autofocus' if username }}>
        </label>
        <button class="btn primary"><span class="spin"></span>Se connecter</button>
      </div>
    </form>
    <div class="foot">
      <span>loco {{ version }}</span>
      {{ theme_toggle() }}
    </div>
  </div>
</div>
{% endblock %}
